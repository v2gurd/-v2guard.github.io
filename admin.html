/* LOGIN */

async function login(){

  const email =
    document.getElementById(
      "loginEmail"
    ).value.trim();


  const password =
    document.getElementById(
      "loginPassword"
    ).value;


  if(!email || !password){

    alert(
      "ایمیل و رمز عبور را وارد کنید."
    );

    return;

  }


  const result =
    await supabaseClient.auth
      .signInWithPassword({
        email,
        password
      });


  if(result.error){

    alert(
      result.error.message
    );

    return;

  }


  await boot();

}


/* BOOT */

async function boot(){

  if(!supabaseClient){

    supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );

  }


  const sessionResult =
    await supabaseClient.auth.getUser();


  if(sessionResult.error){

    showFatal(
      sessionResult.error
    );

    return;

  }


  const user =
    sessionResult.data.user;


  if(!user){

    showLogin();

    return;

  }


  const profile =
    await supabaseClient
      .from("profiles")
      .select(
        "id,email,role"
      )
      .eq("id",user.id)
      .maybeSingle();


  if(profile.error){

    showFatal(
      profile.error
    );

    return;

  }


  if(profile.data?.role !== "admin"){

    document.getElementById(
      "app"
    ).innerHTML = `

      <div class="panel login">

        <h2>
          دسترسی رد شد
        </h2>

        <div class="error">

          این حساب دسترسی مدیر ندارد.

          <br><br>

          ${esc(user.email)}

        </div>

        <br>

        <button
          type="button"
          class="btn primary"
          onclick="logout()"
        >
          ورود با حساب دیگر
        </button>

      </div>

    `;

    return;

  }


  try{

    await loadAll();

    renderShell();

  }catch(e){

    showFatal(e);

  }

}


/* LOAD DATA */

async function loadAll(){

  const products =
    await supabaseClient
      .from("products")
      .select(`
        id,
        name,
        category,
        price,
        active,
        created_at,
        parent_id,
        description,
        volume,
        duration,
        stock,
        image_url,
        sort_order,
        discount_percent
      `)
      .order("sort_order")
      .order("price");


  if(products.error)
    throw products.error;


  const orders =
    await supabaseClient
      .from("orders")
      .select(`
        id,
        order_number,
        status,
        total,
        created_at,
        user_id,
        order_items(
          product_id,
          product_name,
          unit_price,
          quantity
        )
      `)
      .order(
        "created_at",
        {ascending:false}
      );


  if(orders.error)
    throw orders.error;


  const subscriptions =
    await supabaseClient
      .from("subscriptions")
      .select(`
        id,
        product_id,
        subscription_url,
        status,
        assigned_order_id,
        created_at
      `)
      .order(
        "created_at",
        {ascending:false}
      );


  if(subscriptions.error)
    throw subscriptions.error;


  const users =
    await supabaseClient
      .from("profiles")
      .select(
        "id,email,role,created_at"
      )
      .order(
        "created_at",
        {ascending:false}
      );


  if(users.error)
    throw users.error;


  const agencies =
    await supabaseClient
      .from("agencies")
      .select("*")
      .order(
        "created_at",
        {ascending:false}
      );


  if(agencies.error)
    throw agencies.error;


  DATA = {

    products:
      products.data || [],

    orders:
      orders.data || [],

    subscriptions:
      subscriptions.data || [],

    users:
      users.data || [],

    agencies:
      agencies.data || []

  };

}

/* NAVIGATION */

  document
    .querySelectorAll(".nav button")
    .forEach(button => {

      button.classList.toggle(
        "active",
        button.dataset.page === page
      );

    });


  if(page === "dashboard")
    renderDashboard();

  if(page === "products")
    renderProducts();

  if(page === "subscriptions")
    renderSubscriptions();

  if(page === "orders")
    renderOrders();

  if(page === "users")

  if(page === "agencies")

function drawProducts(){

  const q =
    (
      document.getElementById(
        "productSearch"
      )?.value || ""
    ).toLowerCase();


  const parents =
    DATA.products.filter(
      p => !p.parent_id
    );


  const filtered =
    parents.filter(parent => {

      const parentMatch =
        (
          parent.name +
          " " +
          parent.id +
          " " +
          (parent.category || "")
        )
        .toLowerCase()
        .includes(q);


      const childMatch =
        DATA.products.some(
          child =>
            child.parent_id === parent.id &&
            (
              child.name +
              " " +
              child.id
            )
            .toLowerCase()
            .includes(q)
        );


      return parentMatch || childMatch;

    });


  const html =
    filtered.map(parent => {

      const children =
        DATA.products.filter(
          p =>
            p.parent_id === parent.id
        );


      return `

        <div class="product">

          <div class="product-head">

            <div>

              <b>
                ${esc(parent.name)}
              </b>

              <div class="small">
                ${esc(parent.id)}
                •
                ${esc(
                  parent.category ||
                  "سرویس"
                )}
                •
                ${money(parent.price)}
                تومان

            </div>


            <div class="actions">

              <span

                  ? "on"

                }"
              >
                ${
                  parent.active
                  ? "فعال"
                  : "غیرفعال"
                }
              </span>


              <button
                type="button"
                class="btn outline"
                onclick="editProduct('${esc(parent.id)}')"
              >
                ویرایش
              </button>


              <button
                type="button"
                class="btn primary"
                onclick="openNewProduct('${esc(parent.id)}')"
              >
                + پلن داخلی
              </button>


              <button
                type="button"
                class="btn danger"
                onclick="deleteProduct('${esc(parent.id)}')"
              >
                حذف
              </button>

            </div>

          </div>


          ${
            children.map(child => `

              <div class="product-child">

                <div class="product-head">

                  <div>

                    <b>
                      ${esc(child.name)}
                    </b>

                    <div class="small">

                      ${esc(child.id)}

                    >
                      ${

                    </span>


                    <button

                    <button

            `).join("")

async function saveProduct(){

  const id =
    document.getElementById(
      "oldProductId"
    ).value ||
    document.getElementById(
      "productId"
    ).value.trim();


  const name =
    document.getElementById(
      "productName"
    ).value.trim();


  if(!id || !name){

    document.getElementById(
      "productError"
    ).innerHTML =
      `<div class="error">
        شناسه و نام محصول الزامی است.
      </div>`;

    return;

  }


  const data = {

    id,

    name,

    category:
      document.getElementById(
        "productCategory"
      ).value.trim() ||
      "سرویس",

    price:
      Number(
        document.getElementById(
          "productPrice"
        ).value || 0
      ),

    discount_percent:
      Number(
        document.getElementById(
          "productDiscount"
        ).value || 0
      ),

    volume:
      document.getElementById(
        "productVolume"
      ).value.trim() ||
      null,

    duration:
      document.getElementById(
        "productDuration"
      ).value.trim() ||
      null,

    stock:
      Number(
        document.getElementById(
          "productStock"
        ).value || 0
      ),

    sort_order:
      Number(
        document.getElementById(
          "productSort"
        ).value || 0
      ),

    image_url:
      document.getElementById(
        "productImage"
      ).value.trim() ||
      null,

    description:
      document.getElementById(
        "productDescription"
      ).value.trim() ||
      null,

    parent_id:
      document.getElementById(
        "parentProduct"
      ).value ||
      null,

    active:
      document.getElementById(
        "productActive"
      ).checked

  };


  const result =
    await supabaseClient
      .from("products")
      .upsert(data);


  if(result.error){

    document.getElementById(
      "productError"
    ).innerHTML =
      errorHTML(result.error);

    return;

  }


  closeModal(
    "productModal"
  );


  await loadAll();

  renderProducts();

}


async function deleteProduct(id){

  const children =
    DATA.products.filter(
      p =>
        p.parent_id === id
    );


  if(children.length){

    alert(
      "این محصول پلن داخلی دارد. ابتدا پلن‌های داخلی را حذف کنید."
    );

    return;

  }


  if(!confirm(
    "این محصول حذف شود؟"
  ))
    return;


  const result =
    await supabaseClient
      .from("products")
      .delete()
      .eq("id",id);


  if(result.error){

    alert(
      result.error.message
    );

    return;

  }


  await loadAll();

  renderProducts();

}

function setAgencyFilter(filter){

  agencyFilter =
    filter;

  renderAgencies();

}


function drawAgencies(){

  const list =
    document.getElementById(
      "agencyList"
    );


  if(!list)
    return;


  let rows =
    [...DATA.agencies];


  if(
    agencyFilter ===
    "submitted"
  ){

    rows =
      rows.filter(
        a =>
          a.payment_status ===
          "submitted"
      );

  }

  else if(
    agencyFilter ===
    "payment_pending"
  ){

    rows =
      rows.filter(
        a =>
          a.status ===
          "payment_pending" ||
          a.payment_status ===
          "unpaid"
      );

  }

  else if(
    agencyFilter !== "all"
  ){

    rows =
      rows.filter(
        a =>
          a.status ===
          agencyFilter
      );

  }


  if(!rows.length){

    list.innerHTML = `
      <div class="empty">
        درخواستی برای نمایش وجود ندارد.
      </div>
    `;

    return;

  }


  list.innerHTML =
    rows
      .map(renderAgencyCard)
      .join("");

}


function renderAgencyCard(a){

  const paymentSubmitted =
    a.payment_status ===
    "submitted";


  const active =
    a.status ===
    "active";


  const rejected =
    a.status ===
    "rejected";


  let statusClass =
    "pending";


  if(active)
    statusClass =
      "on";


  if(rejected)
    statusClass =
      "off";


  let paymentClass =
    "pending";


  if(
    a.payment_status ===
    "verified"
  )
    paymentClass =
      "approved";


  if(
    a.payment_status ===
    "rejected"
  )
    paymentClass =
      "rejected";


  return `

    <div class="agency-card">

      <div class="agency-card-top">

        <div>

          <div class="agency-name">
            ${esc(
              a.full_name || "-"
            )}
          </div>

          <div class="agency-sub">

            ${esc(
              a.agency_name ||
              "بدون نام نمایندگی"
            )}

            ${
              a.city
              ? ` • ${esc(a.city)}`
              : ""
            }

          </div>

        </div>


        <div class="agency-badges">

          <span
            class="badge ${statusClass}"
          >
            ${agencyStatusText(
              a.status
            )}
          </span>


          <span
            class="badge ${paymentClass}"
          >
            ${paymentStatusText(
              a.payment_status
            )}
          </span>

        </div>

      </div>


      <div class="agency-info">

        <div>
          <b>ایمیل:</b>
          ${esc(a.email || "-")}
        </div>

        <div>
          <b>موبایل:</b>
          ${esc(a.phone || "-")}
        </div>

        <div>
          <b>تلگرام:</b>
          ${esc(a.telegram || "-")}
        </div>

        <div>
          <b>مبلغ نمایندگی:</b>
          ${money(
            a.agency_fee ||
            499000
          )}
          تومان
        </div>

      </div>


      <div class="agency-actions">

        <!-- مهم:
             بدون event listener
             مستقیم تابع اجرا می‌شود -->

        <button
          type="button"
          class="btn outline"
          onclick="showAgencyDetails(this.dataset.id)"
          data-id="${esc(a.id)}"
        >
          مشاهده جزئیات
        </button>


        ${
          paymentSubmitted &&
          !active

          ? `

            <button
              type="button"
              class="btn primary"
              onclick="approveAgency('${esc(a.id)}')"
            >
              ✓ تأیید پرداخت و فعال‌سازی
            </button>

          `

          : ""
        }


        ${
          !active &&
          !rejected

          ? `

            <button
              type="button"
              class="btn danger"
              onclick="rejectAgency('${esc(a.id)}')"
            >
              رد درخواست
            </button>

          `

          : ""
        }

      </div>

    </div>

  `;

}


/* AGENCY DETAILS */

function showAgencyDetails(id){

  const agency =
    DATA.agencies.find(
      a =>
        String(a.id) ===
        String(id)
    );


  if(!agency){

    alert(
      "درخواست نمایندگی پیدا نشد."
    );

    return;

  }


  const modal =
    document.getElementById(
      "agencyModal"
    );


  const content =
    document.getElementById(
      "agencyModalContent"
    );


  if(!modal || !content){

    alert(
      "مودال جزئیات پیدا نشد."
    );

    return;

  }


  const payment =
    agency.payment_data &&
    typeof agency.payment_data ===
    "object"

    ? agency.payment_data
    : {};


  const conditions =
    agency.conditions &&
    typeof agency.conditions ===
    "object"

    ? agency.conditions
    : {};


  let conditionsHTML =
    `<div class="small">
      اطلاعاتی ثبت نشده است.
    </div>`;


  if(
    Object.keys(
      conditions
    ).length
  ){

    conditionsHTML =
      Object.entries(
        conditions
      )
      .map(
        ([key,value]) =>
          `

            <div class="condition-row">

              <b>
                ${esc(key)}
              </b>

              :

              ${esc(
                String(value)
              )}

            </div>

          `
      )
      .join("");

  }


  const submittedAt =
    payment.submitted_at

      ? new Date(
          payment.submitted_at
        ).toLocaleString(

/* APPROVE */

async function approveAgency(id){

  const agency =
    DATA.agencies.find(
      a =>
        String(a.id) ===
        String(id)
    );


  if(!agency)
    return;


  if(
    agency.payment_status !==
    "submitted"
  ){

    alert(
      "هنوز رسید پرداختی برای این درخواست ثبت نشده است."
    );

    return;

  }


  if(!confirm(
    `آیا پرداخت «${agency.full_name}» تأیید و نمایندگی فعال شود؟`
  ))
    return;


  const result =
    await supabaseClient
      .from("agencies")
      .update({
        status:"active",
        payment_status:"verified"
      })
      .eq(
        "id",
        id
      );


  if(result.error){

    alert(
      "فعال‌سازی انجام نشد:\n" +
      result.error.message
    );

    return;

  }


  alert(
    "پرداخت تأیید شد و نمایندگی فعال شد."
  );


  await loadAll();

  renderAgencies();

}


/* REJECT */

async function rejectAgency(id){

  const agency =
    DATA.agencies.find(
      a =>
        String(a.id) ===
        String(id)
    );


  if(!agency)
    return;


  const reason =
    prompt(
      "دلیل رد درخواست را وارد کنید:"
    );


  if(reason === null)
    return;


  const paymentData = {

    ...(agency.payment_data || {}),

    rejection_reason:
      reason.trim() ||
      "بدون توضیح",

    rejected_at:
      new Date().toISOString()

  };


  const result =
    await supabaseClient
      .from("agencies")
      .update({

        status:"rejected",

        payment_status:
          "rejected",

        payment_data:
          paymentData

      })
      .eq(
        "id",
        id
      );


  if(result.error){

    alert(
      "رد درخواست انجام نشد:\n" +
      result.error.message
    );

    return;

  }


  alert(
    "درخواست رد شد."
  );


  await loadAll();

  renderAgencies();

}


/* REFRESH */

async function refreshAgencies(){

  const button =
    document.getElementById(
      "agencyRefreshButton"
    );


  if(button){

    button.disabled = true;

    button.textContent =
      "در حال بروزرسانی...";

  }


  try{

    await loadAll();

    renderAgencies();

  }catch(e){

    alert(
      "بروزرسانی انجام نشد:\n" +
      (e?.message || e)
    );

  }finally{

    const newButton =
      document.getElementById(
        "agencyRefreshButton"
      );


    if(newButton){

      newButton.disabled = false;

      newButton.textContent =
        "↻ بروزرسانی";

    }

  }

}


/* LOGOUT */

async function logout(){

  if(supabaseClient){

    await supabaseClient.auth.signOut();

  }


  showLogin();

}


/* FATAL */

function showFatal(error){

  document.getElementById(
    "app"
  ).innerHTML = `

    <div
      class="panel"
      style="margin-top:50px"
    >

      ${errorHTML(error)}

    </div>

  `;

}


/* START */

window.addEventListener(
  "DOMContentLoaded",
  async () => {

    try{

      supabaseClient =
        supabase.createClient(
          SUPABASE_URL,
          SUPABASE_ANON_KEY
        );


      const session =
        await supabaseClient.auth.getSession();


      if(
        session.data.session
      ){

        await boot();

      }else{

        showLogin();

      }

    }catch(error){

      showFatal(error);

    }

  }
);

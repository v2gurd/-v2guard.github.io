<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>V2GURD | پنل مدیریت</title>

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --p:#087765;
  --pd:#05594d;
  --bg:#f4f7f6;
  --card:#fff;
  --text:#14211f;
  --muted:#687673;
  --line:#e1e9e6;
  --green:#16845e;
  --red:#c74848;
  --yellow:#a9781f;
  --shadow:0 12px 35px rgba(20,33,31,.08);
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Vazirmatn,Tahoma,sans-serif;
}

button,input,select,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.container{
  width:min(1250px,calc(100% - 24px));
  margin:auto;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  padding:22px 0;
}

.logo{
  font-size:24px;
  font-weight:900;
}

.logo span{
  color:var(--p);
}

.nav{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-bottom:18px;
}

.nav button{
  border:1px solid var(--line);
  background:#fff;
  border-radius:10px;
  padding:9px 13px;
  font-size:10px;
  font-weight:800;
}

.nav button.active{
  background:var(--p);
  color:#fff;
  border-color:var(--p);
}

.panel{
  background:#fff;
  border:1px solid var(--line);
  border-radius:16px;
  padding:18px;
  box-shadow:var(--shadow);
  margin-bottom:16px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

.stat{
  background:#fff;
  border:1px solid var(--line);
  border-radius:16px;
  padding:17px;
  box-shadow:var(--shadow);
}

.stat small{
  color:var(--muted);
  display:block;
  font-size:10px;
}

.stat strong{
  font-size:25px;
}

.head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:14px;
}

.head h2{
  margin:0;
  font-size:16px;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}

.btn{
  border:0;
  border-radius:10px;
  padding:9px 13px;
  font-size:10px;
  font-weight:800;
}

.primary{
  background:var(--p);
  color:#fff;
}

.outline{
  background:#fff;
  border:1px solid var(--line);
  color:var(--text);
}

.danger{
  background:#fff1f1;
  color:var(--red);
  border:1px solid #efd2d2;
}

.warning{
  background:#fff8e8;
  color:var(--yellow);
}

.search{
  margin-bottom:12px;
}

.input,
.select,
.textarea{
  width:100%;
  border:1px solid var(--line);
  border-radius:9px;
  padding:9px 10px;
  background:#fff;
  outline:none;
  font-size:10px;
}

.textarea{
  min-height:100px;
  resize:vertical;
}

.form{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.field label{
  display:block;
  color:var(--muted);
  font-size:9px;
  margin-bottom:4px;
}

.table-wrap{
  overflow:auto;
}

.table{
  width:100%;
  min-width:850px;
  border-collapse:collapse;
}

.table th,
.table td{
  padding:10px 8px;
  border-bottom:1px solid var(--line);
  font-size:10px;
  text-align:right;
  vertical-align:middle;
}

.table th{
  color:var(--muted);
  background:#fafcfc;
}

.badge{
  display:inline-block;
  padding:3px 8px;
  border-radius:20px;
  font-size:8px;
  font-weight:900;
}

.on,
.approved{
  background:#eaf7f1;
  color:var(--green);
}

.off,
.rejected{
  background:#fff1f1;
  color:var(--red);
}

.pending{
  background:#fff8e8;
  color:var(--yellow);
}

.tree{
  display:grid;
  gap:10px;
}

.product{
  border:1px solid var(--line);
  border-radius:13px;
  padding:13px;
}

.product-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.product-child{
  margin-top:9px;
  margin-right:15px;
  background:#f8fbfa;
  border-right:3px solid var(--p);
  padding:10px;
  border-radius:9px;
}

.small{
  font-size:9px;
  color:var(--muted);
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(10,20,18,.5);
  display:none;
  align-items:center;
  justify-content:center;
  padding:14px;
  z-index:100;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:min(780px,100%);
  max-height:90vh;
  overflow:auto;
  background:#fff;
  border-radius:18px;
  padding:20px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.modal-head h2{
  margin:0;
  font-size:17px;
}

.close{
  width:35px;
  height:35px;
  border:0;
  border-radius:9px;
  background:#f2f5f4;
}

.error{
  background:#fff1f1;
  color:#963737;
  border:1px solid #efcaca;
  border-radius:12px;
  padding:12px;
  font-size:10px;
  word-break:break-word;
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:25px;
  font-size:10px;
}

.login{
  max-width:430px;
  margin:70px auto;
}

.login .input{
  margin-bottom:9px;
}

.ltr{
  direction:ltr;
  text-align:left;
}

@media(max-width:800px){
  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .form{
    grid-template-columns:1fr;
  }

  .top{
    align-items:flex-start;
    flex-direction:column;
  }

  .table{
    min-width:900px;
  }
}
</style>
</head>

<body>

<div class="container" id="app"></div>

<!-- PRODUCT MODAL -->
<div class="modal" id="productModal">
<div class="modal-box">

<div class="modal-head">
<h2 id="productModalTitle">افزودن محصول</h2>
<button class="close" onclick="closeModal('productModal')">×</button>
</div>

<input type="hidden" id="oldProductId">

<div class="form">

<div class="field">
<label>شناسه محصول</label>
<input class="input" id="productId">
</div>

<div class="field">
<label>محصول والد</label>
<select class="select" id="parentProduct">
<option value="">محصول اصلی</option>
</select>
</div>

<div class="field">
<label>نام محصول</label>
<input class="input" id="productName">
</div>

<div class="field">
<label>دسته‌بندی</label>
<input class="input" id="productCategory">
</div>

<div class="field">
<label>قیمت تومان</label>
<input class="input" id="productPrice" type="number" min="0">
</div>

<div class="field">
<label>درصد تخفیف</label>
<input class="input" id="productDiscount" type="number" min="0" max="100" value="0">
</div>

<div class="field">
<label>حجم</label>
<input class="input" id="productVolume" placeholder="مثلاً 100 گیگ">
</div>

<div class="field">
<label>مدت</label>
<input class="input" id="productDuration" placeholder="مثلاً 30 روز">
</div>

<div class="field">
<label>موجودی</label>
<input class="input" id="productStock" type="number" min="0" value="0">
</div>

<div class="field">
<label>ترتیب نمایش</label>
<input class="input" id="productSort" type="number" value="0">
</div>

<div class="field">
<label>لینک تصویر</label>
<input class="input" id="productImage">
</div>

<div class="field" style="grid-column:1/-1">
<label>توضیحات</label>
<textarea class="textarea" id="productDescription"></textarea>
</div>

</div>

<label style="font-size:10px;display:block;margin-top:9px">
<input type="checkbox" id="productActive" checked>
محصول فعال باشد
</label>

<div class="actions" style="margin-top:15px">
<button class="btn primary" onclick="saveProduct()">ذخیره محصول</button>
<button class="btn outline" onclick="closeModal('productModal')">انصراف</button>
</div>

<div id="productError" style="margin-top:10px"></div>

</div>
</div>

<!-- SUBSCRIPTION MODAL -->
<div class="modal" id="subscriptionModal">
<div class="modal-box">

<div class="modal-head">
<h2>افزودن Subscription</h2>
<button class="close" onclick="closeModal('subscriptionModal')">×</button>
</div>

<div class="field">
<label>محصول / پلن</label>
<select class="select" id="subscriptionProduct"></select>
</div>

<div class="field" style="margin-top:10px">
<label>لینک Subscription</label>
<input class="input ltr" id="subscriptionUrl">
</div>

<div class="actions" style="margin-top:15px">
<button class="btn primary" onclick="saveSubscription()">ذخیره</button>
</div>

<div id="subscriptionError" style="margin-top:10px"></div>

</div>
</div>

<script>

const SUPABASE_URL =
"https://psvesfkxtmlnjyhphsfs.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_QClWgLVOmPGwPK_kTsL5UA_L0cNqJ4H";

let supabaseClient = null;

let DATA = {
products:[],
orders:[],
subscriptions:[],
users:[]
};

let currentPage = "dashboard";

const fa = n =>
String(n ?? 0).replace(/\d/g,d=>"۰۱۲۳۴۵۶۷۸۹"[d]);

const money = n =>
fa(Number(n || 0).toLocaleString("en-US"));

const esc = s =>
String(s ?? "").replace(/[&<>"']/g,m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[m]));

const statusText = s => ({
pending:"در انتظار",
approved:"تأیید شده",
rejected:"رد شده",
available:"آزاد",
assigned:"اختصاص داده شده"
}[s] || s);

function errorHTML(e){

return `
<div class="error">
${esc(e?.message || e?.details || "خطای نامشخص")}
${e?.code ? `<br>Code: ${esc(e.code)}` : ""}
</div>
`;

}

function openModal(id){
document.getElementById(id).classList.add("show");
}

function closeModal(id){
document.getElementById(id).classList.remove("show");
}


/* LOGIN */

function showLogin(){

document.getElementById("app").innerHTML = `

<div class="panel login">

<h2>ورود به پنل مدیریت V2GURD</h2>

<p class="small">
مدیریت محصولات، پلن‌ها، سفارش‌ها و Subscriptionها
</p>

<br>

<input
class="input"
id="loginEmail"
type="email"
placeholder="ایمیل"
>

<input
class="input"
id="loginPassword"
type="password"
placeholder="رمز عبور"
>

<button
class="btn primary"
style="width:100%"
onclick="login()"
>
ورود
</button>

</div>
`;

}

async function login(){

const email =
document.getElementById("loginEmail").value.trim();

const password =
document.getElementById("loginPassword").value;

const result =
await supabaseClient.auth.signInWithPassword({
email,
password
});

if(result.error){

alert(result.error.message);

return;

}

await boot();

}


/* BOOT */

async function boot(){

if(!supabaseClient){

supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);

}

const sessionResult =
await supabaseClient.auth.getUser();

if(sessionResult.error){

showFatal(sessionResult.error);

return;

}

const user =
sessionResult.data.user;

if(!user){

showLogin();

return;

}

const profile =
await supabaseClient
.from("profiles")
.select("id,email,role")
.eq("id",user.id)
.maybeSingle();

if(profile.error){

showFatal(profile.error);

return;

}

if(profile.data?.role !== "admin"){

document.getElementById("app").innerHTML = `

<div class="panel login">

<h2>دسترسی رد شد</h2>

<div class="error">
این حساب دسترسی مدیر ندارد.
<br>
${esc(user.email)}
</div>

<br>

<button
class="btn primary"
onclick="logout()"
>
ورود با حساب دیگر
</button>

</div>

`;

return;

}

try{

await loadAll();

renderShell();

}catch(e){

showFatal(e);

}

}


/* LOAD DATA */

async function loadAll(){

const products =
await supabaseClient
.from("products")
.select(`
id,
name,
category,
price,
active,
created_at,
parent_id,
description,
volume,
duration,
stock,
image_url,
sort_order,
discount_percent
`)
.order("sort_order")
.order("price");

if(products.error)
throw products.error;


const orders =
await supabaseClient
.from("orders")
.select(`
id,
order_number,
status,
total,
created_at,
user_id,
order_items(
product_id,
product_name,
unit_price,
quantity
)
`)
.order("created_at",{ascending:false});

if(orders.error)
throw orders.error;


const subscriptions =
await supabaseClient
.from("subscriptions")
.select(`
id,
product_id,
subscription_url,
status,
assigned_order_id,
created_at
`)
.order("created_at",{ascending:false});

if(subscriptions.error)
throw subscriptions.error;


const users =
await supabaseClient
.from("profiles")
.select("id,email,role,created_at")
.order("created_at",{ascending:false});

if(users.error)
throw users.error;


DATA = {
products:products.data || [],
orders:orders.data || [],
subscriptions:subscriptions.data || [],
users:users.data || []
};

}


/* SHELL */

function renderShell(){

document.getElementById("app").innerHTML = `

<div class="top">

<div class="logo">
V2<span>GURD</span> — پنل مدیریت
</div>

<div class="actions">

<a
class="btn outline"
href="index.html"
>
سایت
</a>

<button
class="btn danger"
onclick="logout()"
>
خروج
</button>

</div>

</div>


<div class="nav">

<button data-page="dashboard"
onclick="goTo('dashboard')">
داشبورد
</button>

<button data-page="products"
onclick="goTo('products')">
محصولات
</button>

<button data-page="subscriptions"
onclick="goTo('subscriptions')">
Subscriptionها
</button>

<button data-page="orders"
onclick="goTo('orders')">
سفارش‌ها
</button>

<button data-page="users"
onclick="goTo('users')">
کاربران
</button>

</div>

<div id="content"></div>

`;

goTo(currentPage);

}


/* NAVIGATION */

function goTo(page){

currentPage = page;

document
.querySelectorAll(".nav button")
.forEach(button => {

button.classList.toggle(
"active",
button.dataset.page === page
);

});

if(page === "dashboard")
renderDashboard();

if(page === "products")
renderProducts();

if(page === "subscriptions")
renderSubscriptions();

if(page === "orders")
renderOrders();

if(page === "users")
renderUsers();

}


/* DASHBOARD */

function renderDashboard(){

const pending =
DATA.orders.filter(
o => o.status === "pending"
).length;

const approved =
DATA.orders.filter(
o => o.status === "approved"
);

const revenue =
approved.reduce(
(sum,o)=>sum + Number(o.total || 0),
0
);

const available =
DATA.subscriptions.filter(
s => s.status === "available"
).length;

document.getElementById("content").innerHTML = `

<div class="stats">

<div class="stat">
<small>کل محصولات</small>
<strong>${fa(DATA.products.length)}</strong>
</div>

<div class="stat">
<small>سفارش‌های در انتظار</small>
<strong>${fa(pending)}</strong>
</div>

<div class="stat">
<small>کاربران</small>
<strong>${fa(DATA.users.length)}</strong>
</div>

<div class="stat">
<small>Subscription آزاد</small>
<strong>${fa(available)}</strong>
</div>

</div>


<div class="panel" style="margin-top:16px">

<div class="head">

<h2>
فروش تأیید شده
</h2>

<strong>
${money(revenue)} تومان
</strong>

</div>

</div>


<div class="panel">

<div class="head">

<h2>
دسترسی سریع
</h2>

</div>

<div class="actions">

<button
class="btn primary"
onclick="openNewProduct()"
>
+ محصول جدید
</button>

<button
class="btn outline"
onclick="openSubscriptionModal()"
>
+ Subscription
</button>

<button
class="btn outline"
onclick="goTo('orders')"
>
مدیریت سفارش‌ها
</button>

</div>

</div>

`;

}


/* PRODUCTS */

function renderProducts(){

document.getElementById("content").innerHTML = `

<div class="panel">

<div class="head">

<h2>
مدیریت محصولات و پلن‌های داخلی
</h2>

<button
class="btn primary"
onclick="openNewProduct()"
>
+ محصول جدید
</button>

</div>

<div class="search">

<input
class="input"
id="productSearch"
placeholder="جستجوی محصول..."
oninput="drawProducts()"
>

</div>

<div
id="productTree"
class="tree"
></div>

</div>

`;

drawProducts();

}

function drawProducts(){

const q =
(document.getElementById("productSearch")?.value || "")
.toLowerCase();

const parents =
DATA.products.filter(
p => !p.parent_id
);

const filtered =
parents.filter(parent => {

const parentMatch =
(
parent.name +
" " +
parent.id +
" " +
(parent.category || "")
)
.toLowerCase()
.includes(q);

const childMatch =
DATA.products.some(child =>
child.parent_id === parent.id &&
(
child.name +
" " +
child.id
)
.toLowerCase()
.includes(q)
);

return parentMatch || childMatch;

});

const html =
filtered.map(parent => {

const children =
DATA.products.filter(
p => p.parent_id === parent.id
);

return `

<div class="product">

<div class="product-head">

<div>

<b>
${esc(parent.name)}
</b>

<div class="small">

${esc(parent.id)}
•
${esc(parent.category || "سرویس")}
•
${money(parent.price)} تومان

</div>

</div>

<div class="actions">

<span class="badge ${parent.active ? "on":"off"}">
${parent.active ? "فعال":"غیرفعال"}
</span>

<button
class="btn outline"
onclick="editProduct('${esc(parent.id)}')"
>
ویرایش
</button>

<button
class="btn primary"
onclick="openNewProduct('${esc(parent.id)}')"
>
+ پلن داخلی
</button>

<button
class="btn danger"
onclick="deleteProduct('${esc(parent.id)}')"
>
حذف
</button>

</div>

</div>


${children.map(child => `

<div class="product-child">

<div class="product-head">

<div>

<b>
${esc(child.name)}
</b>

<div class="small">

${esc(child.id)}
•
حجم: ${esc(child.volume || "-")}
•
مدت: ${esc(child.duration || "-")}
•
قیمت: ${money(child.price)} تومان
•
موجودی: ${fa(child.stock || 0)}

</div>

</div>

<div class="actions">

<span class="badge ${child.active ? "on":"off"}">
${child.active ? "فعال":"غیرفعال"}
</span>

<button
class="btn outline"
onclick="editProduct('${esc(child.id)}')"
>
ویرایش
</button>

<button
class="btn danger"
onclick="deleteProduct('${esc(child.id)}')"
>
حذف
</button>

</div>

</div>

</div>

`).join("")}

</div>

`;

}).join("");

document.getElementById("productTree").innerHTML =
html ||
`<div class="empty">محصولی پیدا نشد.</div>`;

}


/* PRODUCT FORM */

function fillParents(selected=""){

const parents =
DATA.products.filter(
p => !p.parent_id
);

document.getElementById("parentProduct").innerHTML =
`
<option value="">
محصول اصلی
</option>
` +
parents.map(p =>
`
<option value="${esc(p.id)}">
${esc(p.name)}
</option>
`
).join("");

document.getElementById("parentProduct").value =
selected || "";

}


function resetProductForm(){

[
"oldProductId",
"productId",
"productName",
"productCategory",
"productPrice",
"productDiscount",
"productVolume",
"productDuration",
"productStock",
"productSort",
"productImage",
"productDescription"
]
.forEach(id => {

document.getElementById(id).value = "";

});

document.getElementById("productDiscount").value = 0;
document.getElementById("productStock").value = 0;
document.getElementById("productSort").value = 0;
document.getElementById("productActive").checked = true;
document.getElementById("productId").disabled = false;

}


function openNewProduct(parentId=""){

resetProductForm();

fillParents(parentId);

document.getElementById("productModalTitle").textContent =
parentId
? "افزودن پلن داخل محصول"
: "افزودن محصول";

openModal("productModal");

}


function editProduct(id){

const product =
DATA.products.find(
p => p.id === id
);

if(!product)
return;

fillParents(
product.parent_id || ""
);

document.getElementById("productModalTitle").textContent =
"ویرایش محصول";

document.getElementById("oldProductId").value =
product.id;

document.getElementById("productId").value =
product.id;

document.getElementById("productId").disabled =
true;

document.getElementById("productName").value =
product.name || "";

document.getElementById("productCategory").value =
product.category || "";

document.getElementById("productPrice").value =
product.price || 0;

document.getElementById("productDiscount").value =
product.discount_percent || 0;

document.getElementById("productVolume").value =
product.volume || "";

document.getElementById("productDuration").value =
product.duration || "";

document.getElementById("productStock").value =
product.stock || 0;

document.getElementById("productSort").value =
product.sort_order || 0;

document.getElementById("productImage").value =
product.image_url || "";

document.getElementById("productDescription").value =
product.description || "";

document.getElementById("productActive").checked =
product.active !== false;

openModal("productModal");

}


async function saveProduct(){

const id =
document.getElementById("oldProductId").value ||
document.getElementById("productId").value.trim();

const name =
document.getElementById("productName").value.trim();

if(!id || !name){

document.getElementById("productError").innerHTML =
`
<div class="error">
شناسه و نام محصول الزامی است.
</div>
`;

return;

}

const data = {

id:id,

name:name,

category:
document.getElementById("productCategory").value.trim() ||
"سرویس",

price:
Number(
document.getElementById("productPrice").value || 0
),

discount_percent:
Number(
document.getElementById("productDiscount").value || 0
),

volume:
document.getElementById("productVolume").value.trim() ||
null,

duration:
document.getElementById("productDuration").value.trim() ||
null,

stock:
Number(
document.getElementById("productStock").value || 0
),

sort_order:
Number(
document.getElementById("productSort").value || 0
),

image_url:
document.getElementById("productImage").value.trim() ||
null,

description:
document.getElementById("productDescription").value.trim() ||
null,

parent_id:
document.getElementById("parentProduct").value ||
null,

active:
document.getElementById("productActive").checked

};

const result =
await supabaseClient
.from("products")
.upsert(data);

if(result.error){

document.getElementById("productError").innerHTML =
errorHTML(result.error);

return;

}

closeModal("productModal");

await loadAll();

renderProducts();

}


async function deleteProduct(id){

const children =
DATA.products.filter(
p => p.parent_id === id
);

if(children.length){

alert(
"این محصول پلن داخلی دارد. ابتدا پلن‌های داخلی را حذف کنید."
);

return;

}

if(!confirm("این محصول حذف شود؟"))
return;

const result =
await supabaseClient
.from("products")
.delete()
.eq("id",id);

if(result.error){

alert(result.error.message);

return;

}

await loadAll();

renderProducts();

}


/* SUBSCRIPTIONS */

function openSubscriptionModal(){

const products =
DATA.products.filter(
p => p.active
);

document.getElementById("subscriptionProduct").innerHTML =
products.map(p =>
`
<option value="${esc(p.id)}">
${esc(p.name)}
—
${money(p.price)} تومان
</option>
`
).join("");

document.getElementById("subscriptionUrl").value = "";

document.getElementById("subscriptionError").innerHTML = "";

openModal("subscriptionModal");

}


async function saveSubscription(){

const product_id =
document.getElementById("subscriptionProduct").value;

const url =
document.getElementById("subscriptionUrl").value.trim();

if(!url){

document.getElementById("subscriptionError").innerHTML =
`
<div class="error">
لینک Subscription را وارد کنید.
</div>
`;

return;

}

const result =
await supabaseClient
.from("subscriptions")
.insert({

product_id:product_id,

subscription_url:url,

status:"available"

});

if(result.error){

document.getElementById("subscriptionError").innerHTML =
errorHTML(result.error);

return;

}

closeModal("subscriptionModal");

await loadAll();

renderSubscriptions();

}

async function approveOrder(id){

if(!confirm("این سفارش تأیید شود؟"))
return;

const result =
await supabaseClient.rpc(
"approve_order",
{
p_order_id:id
}
);

if(result.error){

alert(result.error.message);

return;

}

await loadAll();

renderOrders();

}


async function rejectOrder(id){

if(!confirm("این سفارش رد شود؟"))
return;

const result =
await supabaseClient.rpc(
"reject_order",
{
p_order_id:id
}
);

if(result.error){

alert(result.error.message);

return;

}

await loadAll();

renderOrders();

}

if(supabaseClient){

await supabaseClient.auth.signOut();

}

showLogin();

}

function showFatal(error){

document.getElementById("app").innerHTML = `

<div class="panel" style="margin-top:50px">

${errorHTML(error)}

</div>

`;

}

async ()=>{

supabaseClient =
supabase.createClient(

);

await supabaseClient.auth.getSession();

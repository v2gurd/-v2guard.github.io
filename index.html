<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#070b12">
<title>V2GURD | Digital Services</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&family=Orbitron:wght@600;700;800;900&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#070b12;
  --bg-soft:#0a0f17;
  --card:#0e151f;
  --card2:#131c28;
  --text:#eef2f7;
  --muted:#8b98a9;
  --green:#a8ff3e;
  --green-soft:rgba(168,255,62,.1);
  --blue:#3aa8ff;
  --cyan:#2be4ef;
  --red:#ff4d70;
  --border:rgba(255,255,255,.08);
  --border-soft:rgba(255,255,255,.05);
  --r-sm:10px;
  --r-md:16px;
  --r-lg:22px;
  --r-xl:28px;
  --font-fa:'Vazirmatn',Tahoma,Arial,sans-serif;
  --font-tech:'Orbitron','Vazirmatn',sans-serif;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  background:
    radial-gradient(circle at 12% 15%,rgba(43,228,239,.05),transparent 30%),
    radial-gradient(circle at 88% 65%,rgba(168,255,62,.045),transparent 32%),
    var(--bg);
  color:var(--text);
  font-family:var(--font-fa);
  font-size:15px;
  line-height:1.6;
  overflow-x:hidden;
  transition:background-color .35s ease,color .35s ease;
}

body.light{
  --bg:#f4f6f9;
  --bg-soft:#eceff3;
  --card:#ffffff;
  --card2:#f6f8fa;
  --text:#10161d;
  --muted:#5c6875;
  --border:rgba(10,15,20,.09);
  --border-soft:rgba(10,15,20,.05);
}

a{
  -webkit-tap-highlight-color:transparent;
}

button{
  font-family:inherit;
}

.eyebrow,
.logo,
.badge,
.section-title small,
.disruption-head small,
.node span,
.server-node strong,
.server-node small,
.coming,
footer p:last-child,
.status-value{
  font-family:var(--font-tech);
}

/* ================= AMBIENT LIGHTS ================= */

.bg-light{
  position:fixed;
  width:320px;
  height:320px;
  border-radius:50%;
  filter:blur(110px);
  opacity:.06;
  pointer-events:none;
  z-index:-1;
  animation:floatLight 16s ease-in-out infinite alternate;
}

.green-light{
  background:var(--green);
  top:-140px;
  right:-120px;
}

.blue-light{
  background:var(--blue);
  bottom:-140px;
  left:-120px;
  animation-delay:4s;
}

.red-light{
  display:none;
}

@keyframes floatLight{
  to{ transform:translate(60px,80px); }
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:-2;
  opacity:.02;
  background-image:
    linear-gradient(rgba(43,228,239,.6) 1px,transparent 1px),
    linear-gradient(90deg,rgba(43,228,239,.6) 1px,transparent 1px);
  background-size:70px 70px;
  mask-image:linear-gradient(to bottom,black,transparent 85%);
}

/* ================= HEADER ================= */

header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(7,11,18,.8);
  backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border-soft);
}

body.light header{
  background:rgba(244,246,249,.92);
}

.nav{
  max-width:1180px;
  margin:auto;
  padding:15px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:19px;
  font-weight:800;
  letter-spacing:1px;
}

.logo span.brand{
  color:var(--green);
  text-shadow:0 0 16px rgba(168,255,62,.35);
}

.verified{
  width:16px;
  height:16px;
  border-radius:50%;
  background:var(--blue);
  color:#fff;
  display:inline-flex;
  align-items:center;
  justify-content:center;
